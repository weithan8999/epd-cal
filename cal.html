<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>价签日历 · 农历 + 四天天气</title>
<style>
  :root{--bd:#dcdcd6;--fg:#1b1b1b;--bg:#f4f4f0}
  *{box-sizing:border-box}
  body{margin:0;padding:22px;background:var(--bg);color:var(--fg);
       font:14px/1.55 "Microsoft YaHei",system-ui,-apple-system,sans-serif}
  .wrap{max-width:780px;margin:0 auto}
  h1{font-size:17px;margin:0 0 3px;font-weight:600}
  .sub{color:#7a7a72;font-size:12px;margin-bottom:14px}
  .card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .row + .row{margin-top:9px}
  input[type=text]{padding:6px 9px;border:1px solid var(--bd);border-radius:6px;width:110px;font:inherit}
  button{padding:7px 14px;border:1px solid #c4c4bd;background:#fff;border-radius:6px;cursor:pointer;font:inherit}
  button:hover:not(:disabled){border-color:#8a8a82}
  button.primary{background:#161616;color:#fff;border-color:#161616}
  button:disabled{opacity:.35;cursor:not-allowed}
  canvas{width:400px;height:300px;background:#fff;border:1px solid var(--bd);border-radius:4px;
         image-rendering:pixelated;display:block;margin:0 auto}
  .canvasbox{padding:6px 0}
  #log{height:100px;overflow:auto;background:#141414;color:#a9e6b4;border-radius:8px;
       padding:8px 10px;font:12px/1.5 Consolas,monospace;white-space:pre-wrap;margin-top:10px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;background:#eee;color:#555}
  .badge.on{background:#d9f2dd;color:#1d6b32}
  .muted{color:#8a8a82;font-size:12px}
  label.chk{display:flex;gap:5px;align-items:center;font-size:13px}
  .scanlist{display:flex;flex-wrap:wrap;gap:8px}
  .devitem{display:flex;flex-direction:column;gap:2px;padding:7px 12px;border:1px solid var(--bd);
           border-radius:8px;cursor:pointer;background:#fafaf7;font-size:13px}
  .devitem:hover{border-color:#8a8a82;background:#fff}
  .devitem b{font-weight:600}
  .devitem span{font-size:11px;color:#8a8a82}
  body.shot #controls,body.shot h1,body.shot .sub{display:none}
  body.shot{padding:0;background:#fff}
  body.shot canvas{width:800px;height:600px;border:none;border-radius:0}
  body.shot #log{display:none}

  /* 手机 / 窄屏 */
  @media (max-width: 520px){
    body{padding:12px}
    .wrap{max-width:none}
    h1{font-size:15px}
    .sub{font-size:11px;margin-bottom:10px}
    .card{padding:10px}
    .row{gap:6px}
    button{padding:6px 11px;font-size:13px}
    input[type=text]{width:76px;font-size:13px}
    .canvasbox{padding:2px 0}
    canvas{width:100%;height:auto;max-width:400px}
    #log{height:80px;font-size:11px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>价签日历 · 农历 + 四天天气</h1>
  <div class="sub">400×300 三色 · 蓝牙直推 · 先「刷新预览」确认版式，再「推送到屏幕」</div>

  <div class="card" id="controls">
    <div class="row">
      <label>城市 <input id="city" type="text" value="北京"></label>
      <button id="btnPreview" class="primary">刷新预览</button>
      <button id="btnConnect">搜索并连接</button>
      <button id="btnLast" disabled>上次设备</button>
      <button id="btnDisconnect" disabled>断开</button>
      <button id="btnDiag">诊断</button>
      <button id="btnSend" disabled>推送到屏幕</button>
      <button id="btnPng">下载 PNG</button>
      <button id="btnFwCal" disabled title="让价签用固件自带日历，日期会自己走">切回固件日历</button>
      <span id="status" class="badge">未连接</span>
    </div>
    <div class="row">
      <label class="chk">名称前缀 <input id="prefix" type="text" value="NRF_EPD_" style="width:96px;padding:3px"></label>
      <label class="chk"><input type="checkbox" id="showAll"> 显示全部蓝牙设备</label>
      <span class="muted">扫描慢时勾上「显示全部蓝牙设备」（不过滤，出现更快）；或双击 <b>打开日历.bat</b> 走本机地址，浏览器会记住授权</span>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="auto"> 每天
        <input id="atHour" type="text" value="7" style="width:38px;text-align:center;padding:3px"> 点自动推送</label>
      <label class="chk">MTU <input id="mtu" type="text" value="244" style="width:52px;padding:3px"></label>
      <span class="muted" id="hint"></span>
    </div>
  </div>

  <div class="card" id="scanbox" style="display:none">
    <div class="muted" style="margin-bottom:6px">搜索到的设备（点一下连接）</div>
    <div id="scanlist" class="scanlist"></div>
  </div>

  <div class="canvasbox" id="canvasbox"><canvas id="cv" width="400" height="300"></canvas></div>

  <div id="log"></div>
<textarea id="pngout" style="display:none"></textarea>
</div>

CAL.forEach(y => { CAL_Y[y.y] = y; });

const WEEK   = ['日','一','二','三','四','五','六'];          // JS 用
const WEEK_M = ['一','二','三','四','五','六','日'];          // 周一起排
const GAN    = '甲乙丙丁戊己庚辛壬癸';
const ZHI    = '子丑寅卯辰巳午未申酉戌亥';
const SX     = '鼠牛虎兔龙蛇马羊猴鸡狗猪';
const MON_CN = ['','正','二','三','四','五','六','七','八','九','十','冬','腊'];
const DAY_CN = ['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
                '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
                '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

function doyOf(y, m, d){
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 1)) / 864e5) + 1;
}

function lunarOf(y, doy){
  const yr = CAL_Y[y];
  if(!yr) return null;
  let cur = yr.m[0];
  for(const mo of yr.m){ if(mo[0] <= doy) cur = mo; else break; }
  return { month: cur[1], day: doy - cur[0] + 1 };
}

function lunarYearOf(y, doy){
  const yr = CAL_Y[y];
  if(!yr) return y;
  const cny = yr.m.find(mo => mo[1] === 1);
  return (cny && doy < cny[0]) ? y - 1 : y;
}

function ganzhiOf(lunarYear){
  return {
    gz: GAN[((lunarYear - 4) % 10 + 10) % 10] + ZHI[((lunarYear - 4) % 12 + 12) % 12],
    sx: SX[((lunarYear - 4) % 12 + 12) % 12]
  };
}

function lunarText(y, doy){
  const l = lunarOf(y, doy);
  if(!l) return '';
  const leap = l.month < 0 ? '闰' : '';
  return leap + MON_CN[Math.abs(l.month)] + '月' + DAY_CN[l.day];
}

/* 每格的副标题：节气 > 节日 > 农历日 */
function subText(y, doy){
  const yr = CAL_Y[y];
  if(yr){
    for(const q of yr.jq){ if(q[0] === doy) return q[1]; }
    for(const f of yr.fes){ if(f[0] === doy && f[1].length <= 4) return f[1]; }
  }
  const l = lunarOf(y, doy);
  return l ? DAY_CN[l.day] : '';
}

function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}

/* 彩云 skycon → 中文 + 图标 */
function cyMeta(v){
  const T = {
    CLEAR_DAY:['晴','sun'],            CLEAR_NIGHT:['晴','sun'],
    PARTLY_CLOUDY_DAY:['多云','sunCloud'], PARTLY_CLOUDY_NIGHT:['多云','sunCloud'],

    HEAVY_RAIN:['大雨','rain'],        STORM_RAIN:['暴雨','rain'],
    LIGHT_SNOW:['小雪','snow'],        MODERATE_SNOW:['中雪','snow'],
    HEAVY_SNOW:['大雪','snow'],        STORM_SNOW:['暴雪','snow'],
    FOG:['雾','fog'],                  LIGHT_HAIL:['冰雹','rain'], HEAVY_HAIL:['冰雹','rain'],
    DUST:['浮尘','fog'],               SAND:['沙尘','fog'],        WIND:['大风','cloud']
  };
  return T[v] || ['—', 'cloud'];
}

  45:['雾','fog'], 48:['雾凇','fog'],

async function geocode(name){
  const u = 'https://geocoding-api.open-meteo.com/v1/search?name=' +
            encodeURIComponent(name) + '&count=1&language=zh&format=json';
  const r = await fetch(u);
  const j = await r.json();
  if(!j.results || !j.results.length) throw new Error('找不到城市「' + name + '」');
  const x = j.results[0];
  return { lat:x.latitude, lon:x.longitude, name:x.name || name };
}

/* 用 <script> 拉数据，绕开跨域限制 */
function jsonp(url, ms){
  return new Promise((resolve, reject) => {
    const name = '_cy' + Math.random().toString(36).slice(2);
    const el = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('请求超时')); }, ms || 9000);
    function done(){
      clearTimeout(timer);
      try{ delete window[name]; }catch(e){}
      if(el.parentNode) el.parentNode.removeChild(el);
    }
    window[name] = data => { done(); resolve(data); };
    el.onerror = () => { done(); reject(new Error('加载失败')); };
    el.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + name;
    document.head.appendChild(el);
  });
}

async function fetchCaiyun(loc){
  const u = 'https://api.caiyunapp.com/v2.6/' + CY_TOKEN + '/' +
            loc.lon + ',' + loc.lat + '/daily.json?dailysteps=3';
  const j = await jsonp(u);
  if(j.status !== 'ok') throw new Error(j.error || '彩云返回异常');

  const d = j.result.daily;
  const days = [];
  for(let i = 0; i < 3; i++){
    const sky = (d.skycon_08h_20h && d.skycon_08h_20h[i] && d.skycon_08h_20h[i].value) ||
                (d.skycon[i] && d.skycon[i].value) || 'CLOUDY';
    const meta = cyMeta(sky);
    const t = d.temperature[i];
    days.push({
      label: ['今天','明天','后天'][i],
      date: +d.skycon[i].date.slice(8, 10),
      text: meta[0], icon: meta[1],
      max: Math.round(t.max), min: Math.round(t.min)
    });
  }
  return days;
}

async function fetchOpenMeteo(loc, pastDays, forecastDays, labels){
  const u = 'https://api.open-meteo.com/v1/forecast' +
    '?latitude=' + loc.lat + '&longitude=' + loc.lon +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
    '&hourly=weather_code' +
    '&timezone=Asia%2FShanghai&past_days=' + pastDays + '&forecast_days=' + forecastDays;
  const r = await fetch(u);
  const j = await r.json();
  if(!j.daily) throw new Error('Open-Meteo 返回异常');

  const hours = (j.hourly && j.hourly.time) || [];
  const hcodes = (j.hourly && j.hourly.weather_code) || [];

  function dayCode(dateStr, fallback){
    const start = hours.indexOf(dateStr + 'T00:00');
    if(start < 0) return fallback;
    const daytime = hcodes.slice(start + 8, start + 21);
    const wet = daytime.filter(c => c >= 51);
    if(wet.length >= 3) return Math.max.apply(null, wet);
    const cnt = {};
    daytime.forEach(c => { cnt[c] = (cnt[c] || 0) + 1; });
    let best = -1, bestN = -1;
    Object.keys(cnt).forEach(k => {
      const n = cnt[k], c = +k;
      if(n > bestN || (n === bestN && c < best)){ best = c; bestN = n; }
    });
    return best >= 0 ? best : fallback;
  }

  const days = [];
  const n = Math.min(labels.length, j.daily.time.length);
  for(let i = 0; i < n; i++){
    const code = dayCode(j.daily.time[i], j.daily.weather_code[i]);
    const meta = WMO[code] || ['—','cloud'];
    days.push({
      label: labels[i],
      date: +j.daily.time[i].slice(8, 10),
      text: meta[0], icon: meta[1],
      max: Math.round(j.daily.temperature_2m_max[i]),
      min: Math.round(j.daily.temperature_2m_min[i])
    });
  }
  return days;
}

      days = cy;
      src = '彩云';
      try{
        const yd = await fetchOpenMeteo(loc, 1, 1, ['昨天']);   // 只要昨天
        if(yd && yd.length){ days = [yd[0]].concat(cy); src = '彩云 + Open-Meteo'; }
      }catch(e2){ log('昨天没取到（' + e2.message + '），只显示三天'); }
    }catch(e){
      log('彩云失败（' + e.message + '），全部改用 Open-Meteo');
    }
  }

  if(!days){
    days = await fetchOpenMeteo(loc, 1, 3, ['昨天','今天','明天','后天']);
    src = 'Open-Meteo';
  }

  const w = { city: loc.name, days: days, src: src };
  try{ localStorage.setItem('zk.wx', JSON.stringify({ t: Date.now(), w: w })); }catch(e){}
  return w;
}
/* 法定节假日 / 调休：NateScarlet/holiday-cn，缓存 7 天 */
async function fetchHolidays(year){
  const ck = 'zk.hol.' + year;
  try{
    const c = JSON.parse(localStorage.getItem(ck) || 'null');
    if(c && c.map && (Date.now() - c.t) < 7 * 864e5) return c.map;
  }catch(e){}

  const urls = [
    'https://fastly.jsdelivr.net/gh/NateScarlet/holiday-cn@master/' + year + '.json',
    'https://gcore.jsdelivr.net/gh/NateScarlet/holiday-cn@master/' + year + '.json',
    'https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/' + year + '.json',
    'https://raw.githubusercontent.com/NateScarlet/holiday-cn/master/' + year + '.json'
  ];
  for(const u of urls){
    try{
      const r = await fetch(u, { cache: 'no-cache' });
      if(!r.ok) continue;
      const j = await r.json();
      const map = {};
      (j.days || []).forEach(x => { map[x.date] = { off: !!x.isOffDay, name: x.name }; });
      localStorage.setItem(ck, JSON.stringify({ t: Date.now(), map }));
      return map;
    }catch(e){ /* 换下一个源 */ }
  }
  return null;
}

/* ------------------------------------------------------------------ *
 *  4. 绘制 400×300                                                   *
 * ------------------------------------------------------------------ */
const GRID_TOP = 56, GRID_BOTTOM = 234, STRIP_TOP = 236;

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawHeader(s){
  const rightX = 378;
  const x0 = 42;              // 右侧内容从城市列之后开始

  // 左列：城市（竖排，独立一列）
  const chars = Array.from(s.city || '');
  const n = chars.length || 1;
  const csize = n <= 2 ? 12 : Math.max(7, 34 / n);
  const step = n <= 2 ? csize * 1.25 : csize;
  const top = (36 - ((n - 1) * step + csize)) / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = C.r;
  ctx.font = csize + 'px ' + FONT;
  chars.forEach((ch, i) => ctx.fillText(ch, 19, top + csize * 0.92 + i * step));

  // 年份
  ctx.textAlign = 'left';
  ctx.fillStyle = C.b;
  ctx.font = 'bold 17px ' + FONT;
  ctx.fillText(String(s.year), x0, 20);
  const yw = ctx.measureText(String(s.year)).width;
  ctx.font = '10.5px ' + FONT;
  ctx.fillText('年', x0 + yw + 1.5, 20);

  // 日期：数字红色，整体跟“第N周”同高、在左侧两行之间垂直居中
  const BIG = 21, BASE = 26;
  ctx.textAlign = 'left';
  ctx.font = BIG + 'px ' + FONT;

  const mStr = String(s.month), dStr = String(s.date);
  const wM  = ctx.measureText(mStr).width;
  const wY  = ctx.measureText('月').width;
  const wD  = ctx.measureText(dStr).width;
  const wR  = ctx.measureText('日').width;
  let dx = 206 - (wM + wY + wD + wR) / 2;

  ctx.fillStyle = C.r; ctx.fillText(mStr, dx, BASE); dx += wM;
  ctx.fillStyle = C.b; ctx.fillText('月',  dx, BASE); dx += wY;
  ctx.fillStyle = C.r; ctx.fillText(dStr, dx, BASE); dx += wD;
  ctx.fillStyle = C.b; ctx.fillText('日',  dx, BASE);

  // 第 XX 周：整体放大，数字红色不加粗
  ctx.textAlign = 'right';
  ctx.font = BIG + 'px ' + FONT;
  const wZhou = ctx.measureText('周').width;
  const wNum  = ctx.measureText(String(s.week)).width;

  let rx = rightX;
  ctx.fillStyle = C.b; ctx.fillText('周', rx, BASE); rx -= wZhou;
  ctx.fillStyle = C.r; ctx.fillText(String(s.week), rx, BASE); rx -= wNum;
  ctx.fillStyle = C.b; ctx.fillText('第', rx, BASE);

  // 第二行：干支 · 农历
  ctx.textAlign = 'left';
  ctx.font = '10px ' + FONT;
  ctx.fillText(s.ganzhi + s.sx + '年 · ' + s.lunarText, x0, 33);
}

function drawWeekBar(){
  const colW = W / 7;
  ctx.textAlign = 'center';
  ctx.font = '11px ' + FONT;
  for(let i = 0; i < 7; i++){
    const cx = (i + 0.5) * colW;
    const wk = i >= 5;
    ctx.fillStyle = wk ? C.r : C.b;
    roundRect(cx - 24, 36, 48, 16, 4);
    ctx.fill();
    ctx.fillStyle = C.w;
    ctx.fillText(WEEK_M[i], cx, 48);
  }
}

function drawGrid(s){
  const colW = W / 7;
  const first = (new Date(s.year, s.month - 1, 1).getDay() + 6) % 7;   // 周一起
  const dim   = new Date(s.year, s.month, 0).getDate();
  const rows  = Math.ceil((first + dim) / 7);
  const rowH  = (GRID_BOTTOM - GRID_TOP) / rows;

  const numSize = Math.max(13, Math.min(17, rowH * 0.46));
  const subSize = Math.max(9, Math.min(11.5, rowH * 0.31));
  const bSize   = Math.max(10, Math.min(12, rowH * 0.33));

  const cellX = i => (i % 7 + 0.5) * colW;
  const cellY = i => GRID_TOP + Math.floor(i / 7) * rowH + rowH / 2;

  // 相邻月份补位（细体、无副标题），把行首行尾的空格填掉
  const prevDim = new Date(s.year, s.month - 1, 0).getDate();
  const total   = rows * 7;
  ctx.textAlign = 'center';
  ctx.font = (numSize * 0.82).toFixed(1) + 'px ' + FONT;
  ctx.fillStyle = C.b;
  for(let i = 0; i < first; i++){
    ctx.fillText(String(prevDim - first + 1 + i), cellX(i), cellY(i) - rowH * 0.06);
  }
  for(let i = 0; i < total - first - dim; i++){
    ctx.fillText(String(i + 1), cellX(first + dim + i), cellY(first + dim + i) - rowH * 0.06);
  }

  for(let d = 1; d <= dim; d++){
    const idx = first + d - 1;
    const cx = cellX(idx), cy = cellY(idx);
    const today = (d === s.date);
    const weekend = (idx % 7 >= 5);
    const key = s.year + '-' + String(s.month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const hd = s.holidays ? s.holidays[key] : null;
    const isHol = !!(hd && hd.off);
    const isMakeup = !!(hd && !hd.off);
    const red = !isMakeup && !isHol && weekend;

    const sub = subText(s.year, doyOf(s.year, s.month, d));
    const numBase = cy - rowH * 0.06;
    const subBase = numBase + subSize + 2.5;

    if(today){
      ctx.fillStyle = C.r;
      roundRect(cx - 24.5, cy - rowH / 2 + 1, 49, rowH - 2, 5);
      ctx.fill();
      ctx.fillStyle = C.w;
      ctx.textAlign = 'center';
      const tNum = cy - rowH * 0.10;
      ctx.font = 'bold ' + numSize + 'px ' + FONT;
      ctx.fillText(String(d), cx, tNum);
      ctx.font = subSize + 'px ' + FONT;
      ctx.fillText(sub, cx, tNum + subSize + 1.5);
      continue;
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = red ? C.r : C.b;
    ctx.font = 'bold ' + numSize + 'px ' + FONT;
    const numStr = String(d);
    const badge = isHol ? '休' : (isMakeup ? '班' : '');
    const numW = ctx.measureText(numStr).width;

    let bW = 0;
    if(badge){ ctx.font = bSize + 'px ' + FONT; bW = ctx.measureText(badge).width; }
    const gap = 2;
    const totalW = numW + (badge ? gap + bW : 0);
    const startX = cx - totalW / 2;

    ctx.font = 'bold ' + numSize + 'px ' + FONT;
    ctx.fillText(numStr, startX + numW / 2, numBase);

    if(badge){
      ctx.font = bSize + 'px ' + FONT;
      ctx.textAlign = 'left';
      ctx.fillStyle = isHol ? C.r : C.b;
      ctx.fillText(badge, startX + numW + gap, numBase + 0.5);
      ctx.textAlign = 'center';
    }

    ctx.fillStyle = red ? C.r : C.b;
    ctx.font = subSize + 'px ' + FONT;
    ctx.fillText(sub, cx, subBase);
  }
}
function drawWeather(s){
  ctx.strokeStyle = C.b;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(10, STRIP_TOP + 0.5);
  ctx.lineTo(390, STRIP_TOP + 0.5);
  ctx.stroke();

  const n = (s.days && s.days.length) ? s.days.length : 4;
  const colW = W / n;
  const big = (n <= 3);

  const labelSize = big ? 11 : 10.5;
  const iconSize  = big ? 26 : 24;
  const textSize  = big ? 13 : 12.5;
  const tempSize  = big ? 15 : 14;
  const lowSize   = big ? 11.5 : 11.5;
  const padX      = big ? 9 : 6;
  const textX     = big ? 30 : 29;
  const labelY    = big ? 251 : 251;
  const iconY     = big ? 255 : 255;
  const textY     = big ? 267 : 267;
  const tempY     = big ? 287 : 287;

  for(let i = 0; i < n; i++){
    const d = s.days[i];
    if(!d) continue;
    const x0 = i * colW + padX;

    ctx.textAlign = 'left';
    ctx.font = labelSize + 'px ' + FONT;
    ctx.fillStyle = (d.label === '今天') ? C.r : C.b;
    ctx.fillText(d.label, x0, labelY);
    const lw = ctx.measureText(d.label).width;
    ctx.fillStyle = C.b;
    ctx.fillText(' ' + d.date + '日', x0 + lw, labelY);

    drawIcon(d.icon, x0, iconY, iconSize);

    ctx.fillStyle = C.b;
    ctx.font = textSize + 'px ' + FONT;
    ctx.fillText(d.text, x0 + textX, textY);

    ctx.font = 'bold ' + tempSize + 'px ' + FONT;
    ctx.fillStyle = C.r;
    const hi = d.max + '°';
    ctx.fillText(hi, x0 + textX, tempY);
    const hw = ctx.measureText(hi).width;
    ctx.fillStyle = C.b;
    ctx.font = lowSize + 'px ' + FONT;
    ctx.fillText('/' + d.min + '°', x0 + textX + hw + 0.5, tempY);
  }
}
/* ---- 图标：24 单位坐标系里画，再缩放 ---- */
function drawIcon(type, x, y, size){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size / 24, size / 24);
  ctx.lineWidth = 2.0;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = C.b;
  ctx.fillStyle = C.b;

  const cloud = (dy = 0) => {
    ctx.beginPath();
    ctx.arc(8.5, 15.6 + dy, 3.4, Math.PI * 0.5, Math.PI * 1.5);
    ctx.arc(12.4, 11.2 + dy, 4.9, Math.PI * 1.02, Math.PI * 1.9);
    ctx.arc(17.6, 14.4 + dy, 3.5, Math.PI * 1.35, Math.PI * 0.5);
    ctx.lineTo(8.5, 19 + dy);
    ctx.closePath();
    ctx.fill();
  };

  if(type === 'sun'){
    ctx.fillStyle = C.r;
    ctx.beginPath(); ctx.arc(12, 12, 4.0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.b;
    for(let i = 0; i < 8; i++){
      const a = i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(12 + Math.cos(a) * 7.0, 12 + Math.sin(a) * 7.0);
      ctx.lineTo(12 + Math.cos(a) * 9.8, 12 + Math.sin(a) * 9.8);
      ctx.stroke();
    }
  }else if(type === 'sunCloud'){
    ctx.strokeStyle = C.b;
    ctx.beginPath(); ctx.arc(8.6, 8.2, 3.3, 0, Math.PI * 2); ctx.stroke();
    for(let i = 0; i < 6; i++){
      const a = i * Math.PI / 3 + 0.3;
      ctx.beginPath();
      ctx.moveTo(8.6 + Math.cos(a) * 5.2, 8.2 + Math.sin(a) * 5.2);
      ctx.lineTo(8.6 + Math.cos(a) * 6.8, 8.2 + Math.sin(a) * 6.8);
      ctx.stroke();
    }
    cloud(4.2);
  }else if(type === 'cloud'){
    cloud();
  }else if(type === 'fog'){
    for(let i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.moveTo(5.5, 9 + i * 4.6);
      ctx.lineTo(18.5 - i * 2.2, 9 + i * 4.6);
      ctx.stroke();
    }
  }else if(type === 'rain' || type === 'drizzle'){
    cloud(-2.2);
    const n = type === 'rain' ? 3 : 2;
    for(let i = 0; i < n; i++){
      ctx.beginPath();
      ctx.moveTo(7.6 + i * 4.2, 18.4);
      ctx.lineTo(6.4 + i * 4.2, 22.2);
      ctx.stroke();
    }
  }else if(type === 'snow'){
    cloud(-2.2);
    ctx.fillStyle = C.b;
    for(let i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.arc(7.8 + i * 4.2, 20.6, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }else if(type === 'thunder'){
    cloud(-3);
    ctx.fillStyle = C.b;
    ctx.beginPath();
    ctx.moveTo(13.2, 14.6); ctx.lineTo(9.4, 20.6); ctx.lineTo(11.9, 20.6);
    ctx.lineTo(10.4, 23.6); ctx.lineTo(15.2, 17.8); ctx.lineTo(12.4, 17.8);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* 预览即实机：把画布量化成黑/白/红三色，和推给屏幕的位图完全一致 */
function quantize(){
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  for(let i = 0; i < d.length; i += 4){
    const r = d[i], g = d[i+1], b = d[i+2];
    const white = Math.min(r, g, b) > 170;
    const red = !white && r > 140 && (r - g) > 50 && (r - b) > 50;
    if(white){ d[i] = d[i+1] = d[i+2] = 255; }
    else if(red){ d[i] = 255; d[i+1] = 0; d[i+2] = 0; }
    else { d[i] = d[i+1] = d[i+2] = 0; }
    d[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
function render(s){
  ctx.fillStyle = C.w;
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'alphabetic';
  drawHeader(s);
  drawWeekBar();
  drawGrid(s);
  drawWeather(s);
  quantize();
}

/* ------------------------------------------------------------------ *
 *  5. 三色编码 + 蓝牙推送                                            *
 * ------------------------------------------------------------------ */
const SVC    = '62750001-d828-918d-fb46-b6c11c675aec';
const CH_RX  = '62750002-d828-918d-fb46-b6c11c675aec';
const CH_TX  = '62750003-d828-918d-fb46-b6c11c675aec';
const CMD    = { SET_PINS:0, INIT:1, CLEAR:2, REFRESH:5, SET_TIME:32, WRITE_IMG:48 };

let device = null, rxChar = null, txChar = null;
let MTU = 244, DELAY = 6, INTERLEAVE = 25, writing = false, CLOSE_AFTER = false;

async function bleWrite(cmd, payload, withResp = true){
  while(writing) await sleep(5);
  if(!rxChar) throw new Error('未连接');
  writing = true;
  try{
    const out = [cmd];
    if(payload) for(const byte of payload) out.push(byte);
    const buf = new Uint8Array(out);
    if(withResp){
      await rxChar.writeValueWithResponse(buf);
    }else{
      try{ await rxChar.writeValueWithoutResponse(buf); }
      catch(e){ await rxChar.writeValueWithResponse(buf); }
    }
    await sleep(DELAY);
  }finally{
    writing = false;
  }
}

async function writePlane(bytes, kind){
  const chunk = Math.min(MTU - 2, 243);
  const total = Math.ceil(bytes.length / chunk);
  let sent = 0, left = INTERLEAVE;

  for(let off = 0; off < bytes.length; off += chunk){
    const part = bytes.subarray(off, off + chunk);
    const pkt = new Uint8Array(part.length + 1);
    pkt[0] = (kind === 'bw' ? 0x0F : 0x00) | (off === 0 ? 0x00 : 0xF0);
    pkt.set(part, 1);

    const needResp = left <= 0;
    if(needResp) left = INTERLEAVE; else left--;
    await bleWrite(CMD.WRITE_IMG, pkt, needResp);

    sent++;
    if(sent % 20 === 0) setStatus('发送中 ' + Math.round(sent * 100 / total) + '%', true);
  }
}

/* 量化成两片 1bpp：p1=白，p2=非红 */
function encode3(img){
  const d = img.data;
  const stride = Math.ceil(W / 8);
  const p1 = new Uint8Array(stride * H);
  const p2 = new Uint8Array(stride * H);

  for(let y = 0; y < H; y++){
    for(let x = 0; x < W; x++){
      const i = (y * W + x) * 4;
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const white = Math.min(r, g, b) > 170;
      const red   = !white && r > 140 && (r - g) > 50 && (r - b) > 50;
      const k = y * stride + (x >> 3);
      const bit = 7 - (x & 7);
      if(white) p1[k] |= (1 << bit);
      if(!red)  p2[k] |= (1 << bit);
    }
  }
  return { p1, p2 };
}

async function sendImage(enc){
  setStatus('初始化…', true);
  await bleWrite(CMD.INIT);
  log('→ 黑白层');
  await writePlane(enc.p1, 'bw');
  log('→ 红色层');
  await writePlane(enc.p2, 'red');
  setStatus('刷屏中…', true);
  await bleWrite(CMD.REFRESH);
}

/* 传输参数：从快到稳依次尝试，哪套成功就用哪套 */
function transferPlans(){
  if(MTU > 20){
    return [
      { mtu: MTU, delay: 6,  inter: 25  },
      { mtu: 20,  delay: 2,  inter: 120 },
      { mtu: 20,  delay: 8,  inter: 40  },
      { mtu: 20,  delay: 15, inter: 20  }
    ];
  }
  return [
    { mtu: 20, delay: 0,  inter: 150 },
    { mtu: 20, delay: 2,  inter: 120 },
    { mtu: 20, delay: 8,  inter: 40  },
    { mtu: 20, delay: 15, inter: 20  }
  ];
}

async function pushToScreen(){
  if(!rxChar) return;
  $('btnSend').disabled = true;
  const t0 = Date.now();
  const deviceMtu = MTU;
  try{
    const enc = encode3(ctx.getImageData(0, 0, W, H));
    const plans = transferPlans();
    let used = null;

    for(let i = 0; i < plans.length && !used; i++){
      const p = plans[i];
      MTU = p.mtu; DELAY = p.delay; INTERLEAVE = p.inter;
      try{
        await sendImage(enc);
        used = p;
      }catch(e){
        log('⚠ 第 ' + (i + 1) + ' 套参数失败（' + e.message + '），换更稳的再试');
      }
    }
    if(!used) throw new Error('四套参数都没传完，可能价签被占用或超出范围');

    MTU = deviceMtu;
    $('mtu').value = deviceMtu;

    const sec = ((Date.now() - t0) / 1000).toFixed(1);
    log('✔ 已发送，用时 ' + sec + ' 秒（包 ' + used.mtu + ' / 间隔 ' + used.delay + 'ms）；屏幕全刷还需 15–20 秒');
    setStatus('已发送', true);
    localStorage.setItem('zk.lastPush', new Date().toDateString());
    try{
      if(location.hostname === '127.0.0.1' || location.hostname === 'localhost')
        fetch('/_log?ok=1&sec=' + sec + '&day=' + new Date().toISOString().slice(0,10), { cache:'no-store' });
    }catch(e){}
    if(CLOSE_AFTER) setTimeout(() => window.close(), 20000);
  }catch(e){
    log('✘ 推送失败：' + e.message);
    setStatus('推送失败');
  }finally{
    $('btnSend').disabled = !rxChar;
  }
}

async function attach(dev){
  device = dev;
  log('连接 ' + (dev.name || '(未命名)'));

  // Windows 上 BLE 握手经常第一次失败，重试三次基本能连上
  let gatt = null, svc = null;
  for(let i = 1; i <= 3; i++){
    try{
      gatt = await dev.gatt.connect();
      svc  = await gatt.getPrimaryService(SVC);
      break;
    }catch(e){
      log(`第 ${i} 次连接失败：` + e.message);
      try{ dev.gatt.disconnect(); }catch(_){}
      if(i < 3) await sleep(1200);
    }
  }
  if(!svc){
    throw new Error('连不上，多半是被手机占着，或 Windows 里还留着旧配对记录');
  }

  rxChar = await svc.getCharacteristic(CH_RX);
  txChar = await svc.getCharacteristic(CH_TX);
  log('✔ 服务已就绪');

  try{
    const v = await txChar.readValue();
    const b = new Uint8Array(v.buffer);
    log('固件版本：' + b[0] + '（0x' + b[0].toString(16) + '）');
  }catch(e){ /* 有些固件不可读 */ }

  try{
    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', ev => {
      const str = new TextDecoder().decode(ev.target.value);
      if(str.startsWith('mtu=')){
        const m = parseInt(str.slice(4));
        if(m > 0){ MTU = m; $('mtu').value = m; log('MTU = ' + MTU); }
      }
    });
  }catch(e){}

  dev.addEventListener('gattserverdisconnected', () => {
    rxChar = null;
    $('btnSend').disabled = true;
    $('btnFwCal').disabled = true;
    $('btnDisconnect').disabled = true;
    setStatus('已断开');
    log('设备已断开');
  });

  $('btnSend').disabled = false;
  $('btnFwCal').disabled = false;
  $('btnDisconnect').disabled = false;
  setStatus('已连接', true);
  if(MTU <= 20) log('提示：设备未上报 MTU，可把 MTU 手动改成 247 提速');
  return true;
}

/* ---------------- 设备记忆 ---------------- */
let lastDev = null;

function saveDevice(dev){
  if(!dev) return;
  lastDev = { id: dev.id, name: dev.name || '' };
  localStorage.setItem('zk.dev', JSON.stringify(lastDev));
  const b = $('btnLast');
  b.disabled = false;
  b.textContent = '上次：' + (lastDev.name || '设备');
}

function loadDevice(){
  try{
    const d = JSON.parse(localStorage.getItem('zk.dev') || 'null');
    if(d && d.id){
      lastDev = d;
      const b = $('btnLast');
      b.disabled = false;
      b.textContent = '上次：' + (d.name || '设备');
    }
  }catch(e){}
}

/* ---------------- 连接 ---------------- */

/* 系统选择框（可按名称前缀过滤） */
async function connectChooser(){
  const prefix = $('prefix').value.trim();
  const all = $('showAll').checked;
  const opts = { optionalServices: [SVC] };
  if(!all && prefix) opts.filters = [{ namePrefix: prefix }];
  else opts.acceptAllDevices = true;

  log('打开系统选择框：价签要广播一次才会出现，省电时可能要等几秒');
  let dev;
  try{
    dev = await navigator.bluetooth.requestDevice(opts);
  }catch(e){
    log('已取消：' + e.message);
    return false;
  }
  try{
    await attach(dev);
    saveDevice(dev);
    return true;
  }catch(e){
    log('✘ 连接失败：' + e.message);
    log('处理顺序：① 手机上关页面/关蓝牙 ② Windows 蓝牙设置里删掉这个设备 ③ 关一次再开蓝牙开关 ④ 再点「搜索并连接」');
    return false;
  }
}

/* 搜索引擎式扫描（Chrome 需开启 Experimental Web Platform features） */
async function scanDevices(){
  if(!navigator.bluetooth){
    log('✘ 当前浏览器不支持 Web Bluetooth，请用 Chrome / Edge（桌面版）');
    return;
  }
  if(!navigator.bluetooth.requestLEScan){
    log('浏览器没有扫描接口，改用系统选择框（已按名称前缀过滤）');
    return connectChooser();
  }

  const box = $('scanbox'), list = $('scanlist');
  box.style.display = 'block';
  list.innerHTML = '<div class="muted">扫描中…</div>';

  const seen = new Set();
  let scan;
  try{
    scan = await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true });
  }catch(e){
    log('扫描失败：' + e.message);
    box.style.display = 'none';
    return;
  }

  const onAdv = ev => {
    const id = ev.device.id;
    if(seen.has(id)) return;
    seen.add(id);
    if(seen.size === 1) list.innerHTML = '';
    const name = ev.device.name || ev.device.id.slice(0, 12);
    const item = document.createElement('div');
    item.className = 'devitem';
    item.innerHTML = '<b>' + name.replace(/[<>&]/g, '') + '</b><span>信号 ' +
                     (ev.rssi || 0) + ' dBm</span>';
    item.onclick = async () => {
      try{ scan.stop(); }catch(e){}
      box.style.display = 'none';
      try{ await attach(ev.device); saveDevice(ev.device); }
      catch(e){ log('✘ 连接失败：' + e.message); }
    };
    list.appendChild(item);
  };
  navigator.bluetooth.addEventListener('advertisementreceived', onAdv);

  setTimeout(() => {
    try{ scan.stop(); }catch(e){}
    navigator.bluetooth.removeEventListener('advertisementreceived', onAdv);
    if(!seen.size) list.innerHTML = '<div class="muted">没扫到设备，试试「显示全部蓝牙设备」或确认价签在附近</div>';
  }, 10000);
}

/* 切回固件日历：日期/农历由价签自己的 RTC 走，不需要再推图；但就没有天气了 */
async function firmwareCalendar(){
  if(!rxChar) return;
  try{
    const t = Math.floor(Date.now() / 1000);
    const pkt = new Uint8Array([
      (t >> 24) & 255, (t >> 16) & 255, (t >> 8) & 255, t & 255,
      -(new Date().getTimezoneOffset()) / 60,
      1                                   // 1 = 日历模式
    ]);
    await bleWrite(CMD.SET_TIME, pkt);
    log('✔ 已切回固件日历：日期会自己走，天气不再显示');
    setStatus('固件日历');
  }catch(e){
    log('✘ 切换失败：' + e.message);
  }
}

/* 一键诊断：把浏览器/来源/权限/连接状态摊开，方便判断是"没广播"还是"收不到" */
async function diagnose(){
  log('———— 诊断 ————');
  log('来源：' + location.origin + '（' + (window.isSecureContext ? '安全上下文 ✓' : '非安全上下文 ✗ 必须 https 或 localhost') + '）');
  log('Web Bluetooth：' + (navigator.bluetooth ? '支持 ✓' : '不支持 ✗（Firefox/Safari 都不支持）'));

  if(navigator.bluetooth && navigator.bluetooth.getDevices){
    try{
      const ds = await navigator.bluetooth.getDevices();
      log('已授权设备：' + ds.length + ' 台' +
          (ds.length ? '（' + ds.map(d => (d.name || '未命名') + (d.gatt.connected ? '[已连]' : '')).join('、') + '）' : ''));
    }catch(e){
      log('读取已授权设备失败：' + e.message);
    }
  }else{
    log('当前浏览器无法读取已授权设备列表');
  }

  log('当前连接：' + (rxChar ? '已连接 ' + ((device && device.name) || '') : '未连接'));
  log('提示：如果「已授权设备」里有 5C43 但扫不到，说明它正被别的主机占用或已休眠');
}

/* 主动断开：BLE 同一时刻只允许一个主机连接，换设备前先在这里放手 */
async function disconnectDevice(){
  try{
    if(device && device.gatt && device.gatt.connected) device.gatt.disconnect();
  }catch(e){}
  rxChar = null; txChar = null;
  $('btnSend').disabled = true;
  $('btnDisconnect').disabled = true;
  setStatus('已断开');
  log('已断开连接，价签现在可以给手机连了');
}

/* 重连记住的设备（silent=true 时不打日志，用于打开页面时静默重连） */
async function connectLast(silent){
  if(!navigator.bluetooth || !navigator.bluetooth.getDevices) return false;
  if(!lastDev){ if(!silent) log('还没有记住的设备，先搜索连接一次'); return false; }
  let devs = [];
  try{ devs = await navigator.bluetooth.getDevices(); }catch(e){ if(!silent) log('getDevices 失败：' + e.message); }
  const hit = devs.find(d => d.id === lastDev.id) ||
              devs.find(d => lastDev.name && d.name === lastDev.name);
  if(!hit){
    if(!silent) log('浏览器还没记住这台设备的授权，请点「搜索并连接」按前缀再选一次');
    return false;
  }
  try{
    await attach(hit);
    saveDevice(hit);
    return true;
  }catch(e){
    if(!silent) log('✘ 重连失败：' + e.message);
    return false;
  }
}

async function autoConnect(){
  if(await connectLast()) return device;
  if(!navigator.bluetooth || !navigator.bluetooth.getDevices) return null;
  let devs = [];
  try{ devs = await navigator.bluetooth.getDevices(); }catch(e){ return null; }
  for(const d of devs){
    try{
      await attach(d);
      saveDevice(d);
      return d;
    }catch(e){ /* 不是价签，换下一个 */ }
  }
  return null;
}

/* ------------------------------------------------------------------ *
 *  6. 状态与交互                                                     *
 * ------------------------------------------------------------------ */
let state = null;
let OVERRIDE = null;
const now = () => OVERRIDE || new Date();

function baseState(city){
  const t = now();
  const doy = doyOf(t.getFullYear(), t.getMonth() + 1, t.getDate());
  const ly  = lunarYearOf(t.getFullYear(), doy);
  const gz  = ganzhiOf(ly);
  return {
    year: t.getFullYear(), month: t.getMonth() + 1, date: t.getDate(),
    dow: t.getDay(), week: isoWeek(t), city: city || '北京',
    ganzhi: gz.gz, sx: gz.sx, lunarText: lunarText(t.getFullYear(), doy),
    days: []
  };
}

function mockDays(){
  const t = now();
  const meta = [['阴','cloud'], ['多云','sunCloud'], ['小雨','rain'], ['晴','sun']];
  const max = [19, 22, 19, 24], min = [11, 14, 12, 13];
  return [-1, 0, 1, 2].map((off, i) => {
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + off);
    return { label: ['昨天','今天','明天','后天'][i], date: d.getDate(),
             text: meta[i][0], icon: meta[i][1], max: max[i], min: min[i] };
  });
}

async function refresh(useMock = false){
  const city = $('city').value.trim() || '北京';
  localStorage.setItem('zk.city', city);

  const s = baseState(city);
  s.holidays = await fetchHolidays(s.year);

  if(useMock){
    s.days = mockDays();
    state = s;
    render(s);
    return s;
  }
  try{
    $('hint').textContent = '拉取天气…';
    const w = await fetchWeather(city);
    s.city = w.city;
    s.days = w.days;
    localStorage.setItem('zk.weather', JSON.stringify(w));
    $('hint').textContent = '天气已更新 ' + now().toLocaleTimeString('zh-CN');
    log('天气：' + w.city + '（' + w.src + '） ' + w.days.map(d => d.label + ' ' + d.text + ' ' + d.max + '/' + d.min).join('，'));
  }catch(e){
    log('✘ 天气获取失败：' + e.message);
    const cache = localStorage.getItem('zk.weather');
    if(cache){ s.days = JSON.parse(cache).days; log('使用上次缓存数据'); }
    else { s.days = mockDays(); }
    $('hint').textContent = '天气获取失败，已用缓存';
  }
  state = s;
  render(s);
  return s;
}

/* 每日自动推送：到点且今天没推过就推（错过也会补） */
let autoBusy = false;

async function dailyTick(){
  if(autoBusy || !$('auto').checked) return;
  const t = now();
  const key = t.toDateString();
  if(localStorage.getItem('zk.lastPush') === key) return;
  if(t.getHours() < (parseInt($('atHour').value) || 7)) return;

  autoBusy = true;
  try{
    if(!rxChar){
      log('尝试重连…');
      await autoConnect();
      if(!rxChar) return;
    }
    log('每日自动更新（' + key + '）');
    await refresh();
    await pushToScreen();
  }finally{
    autoBusy = false;
  }
}
setInterval(dailyTick, 60 * 1000);

/* ------------------------------------------------------------------ *
 *  7. 绑定与启动                                                     *
 * ------------------------------------------------------------------ */
$('btnPreview').onclick = () => refresh();
$('btnConnect').onclick = () => scanDevices();
$('btnLast').onclick    = () => connectLast();
$('btnDisconnect').onclick = () => disconnectDevice();
$('btnSend').onclick    = () => pushToScreen();
$('btnFwCal').onclick = () => firmwareCalendar();
$('btnDiag').onclick = () => diagnose();
$('btnPng').onclick = () => {
  const a = document.createElement('a');
  a.download = 'zkong-' + Date.now() + '.png';
  a.href = cv.toDataURL('image/png');
  a.click();
};
$('mtu').onchange = () => {
  const v = parseInt($('mtu').value);
  if(v > 20 && v <= 247) MTU = v;
};
$('auto').onchange = () => localStorage.setItem('zk.auto', $('auto').checked ? '1' : '0');
$('atHour').onchange = () => localStorage.setItem('zk.hour', $('atHour').value);
$('prefix').onchange = () => localStorage.setItem('zk.prefix', $('prefix').value.trim());

function selfTest(){
  const t = document.createElement('canvas');
  t.width = W; t.height = H;
  const c = t.getContext('2d');
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#000000'; c.fillRect(0, 0, 100, H);
  c.fillStyle = '#ff0000'; c.fillRect(300, 0, 100, H);
  const enc = encode3(c.getImageData(0, 0, W, H));
  const stride = Math.ceil(W / 8);
  const at = (arr, x, y) => (arr[y * stride + (x >> 3)] >> (7 - (x & 7))) & 1;
  log('SELFTEST len=' + enc.p1.length + '/' + enc.p2.length +
      ' white=' + at(enc.p1, 200, 10) + at(enc.p2, 200, 10) +
      ' black=' + at(enc.p1, 50, 10) + at(enc.p2, 50, 10) +
      ' red=' + at(enc.p1, 350, 10) + at(enc.p2, 350, 10));
}

(function init(){
  const params = new URLSearchParams(location.search);
  const shot = params.has('shot');
  const auto = params.has('auto');
  CLOSE_AFTER = params.has('close');

  const qCity = params.get('city');
  if(qCity) $('city').value = qCity;
  const savedCity = localStorage.getItem('zk.city');
  if(savedCity && !qCity) $('city').value = savedCity;
  if(localStorage.getItem('zk.auto') === '1') $('auto').checked = true;
  const savedHour = localStorage.getItem('zk.hour');
  if(savedHour) $('atHour').value = savedHour;
  const savedPrefix = localStorage.getItem('zk.prefix');
  if(savedPrefix) $('prefix').value = savedPrefix;
  loadDevice();

  if(/iPad|iPhone|iPod/.test(navigator.userAgent) && !navigator.bluetooth){
    $('hint').textContent = 'iPhone 请用 Bluefy 浏览器打开（Safari 不支持蓝牙）';
  }

  const ym = params.get('ym');
  if(ym){ const p = ym.split('-').map(Number); OVERRIDE = new Date(p[0], p[1] - 1, 15); }

  if(params.has('selftest')) selfTest();

  if(shot){
    document.body.classList.add('shot');
    refresh(true).then(() => { document.getElementById('pngout').textContent = cv.toDataURL('image/png'); });
    return;
  }

  (async () => {
    await refresh();

    if(!auto){
      // 打开页面就静默重连上次的设备，省掉扫描
      if(lastDev) await connectLast(true);
      return;
    }

    // 开机/登录触发：今天已经推过就不再推，避免一天登录好几次重复刷屏
    const today = new Date().toDateString();
    const force = params.has('force');
    if(!force && localStorage.getItem('zk.lastPush') === today){
      log('今天已经推送过了（' + localStorage.getItem('zk.lastPush') + '），跳过');
      setStatus('今天已推送', true);
      return;
    }

    log('自动模式：找回已授权的价签…');
    for(let i = 0; i < 3; i++){
      const dev = await autoConnect();
      if(dev){ await pushToScreen(); return; }
      if(i < 2){ log('没找到设备，20 秒后重试'); await sleep(20000); }
    }
    log('✘ 没找到已授权的价签，请先手动连接一次并点「允许」');
    setStatus('需要手动连接');
  })();
})();
</script>
